<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Baby Carriage / Sync Icon Iconography inside Safe Zone (central 80%) -->
  <g filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" transform="translate(40, 36)">
    <!-- Baby Hood -->
    <path d="M120 220 A100 100 0 0 1 312 220 L312 260 L120 260 Z" fill="#ffffff" fill-opacity="0.2"/>
    <path d="M120 220 C120 140 180 100 240 100 C300 100 320 160 320 220" />
    <path d="M120 220 L320 220" />
    <!-- Bassinet Basket -->
    <path d="M120 220 C120 290 170 330 240 330 C310 330 330 290 330 220" />
    <!-- Handle -->
    <path d="M330 200 L370 140" />
    <!-- Wheels -->
    <circle cx="170" cy="360" r="28" fill="#ffffff" stroke="#ffffff" stroke-width="8" />
    <circle cx="290" cy="360" r="28" fill="#ffffff" stroke="#ffffff" stroke-width="8" />
    <!-- Cloud sync arcs -->
    <path d="M80 140 A30 30 0 0 1 120 120 A40 40 0 0 1 180 130" stroke="#a7f3d0" stroke-width="18"/>
  </g>
</svg>
